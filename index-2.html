<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>CRINX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

/* ===== Theme tokens — Light: white/blue · Dark: black/blue ===== */
:root{
  --page:#E8EBF2;--s0:#FFFFFF;--s1:#F4F6FA;--s2:#EBEEF4;--s3:#DDE2EB;--line:#E2E6EE;--tx:#0A0B0F;--mu:#667085;--ph:#9AA3B2;
  --ac:#0500FF;--act:#0500FF;--acsh:#0300A0;--acd:#EEEDFF;--acl:#BDB9FF;--onac:#FFFFFF;
  --pos:#0A8A52;--posd:#E5F6ED;--warn:#9A5800;--warnbg:#FFF6E6;--warnln:#F1D7A0;--err:#D92D3A;--gold:#A97B12;
  --grad:linear-gradient(90deg,#0500FF,#3D6BFF 55%,#3AB8FF);
  --frame:#D3D7DF;--frame2:#C4C9D2;--shadow:0 30px 70px rgba(20,30,70,.18);--scrim:rgba(10,12,25,.35);
  --wall:linear-gradient(165deg,#b9ccff 0%,#e4e8ff 48%,#f2e4ff 100%);--wtx:#0A0B0F;--fold:rgba(255,255,255,.5);
  color-scheme:light}
:root[data-theme="dark"]{
  --page:#000;--s0:#0A0B0D;--s1:#131418;--s2:#1B1D22;--s3:#272A31;--line:#24272D;--tx:#F3F4F6;--mu:#8B919B;--ph:#5F6772;
  --ac:#2A35FF;--act:#8592FF;--acsh:#141A9E;--acd:#13174A;--acl:#2F3890;--onac:#FFFFFF;
  --pos:#3DDC97;--posd:#0E2A1F;--warn:#F2B544;--warnbg:#1D170A;--warnln:#4A3A14;--err:#FF7A7A;--gold:#F2C14E;
  --grad:linear-gradient(90deg,#3A44FF,#5B7CFF 55%,#5FC8FF);
  --frame:#16181C;--frame2:#2A2D33;--shadow:0 40px 80px rgba(0,0,0,.6);--scrim:rgba(0,0,0,.6);
  --wall:linear-gradient(165deg,#1b2672 0%,#0a0d2e 50%,#020206 100%);--wtx:#FFFFFF;--fold:rgba(255,255,255,.1);
  color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);color:var(--tx);font:15px/1.4 Jost,system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* Device */
.phone{position:relative;width:390px;height:844px;background:var(--s0);border-radius:54px;overflow:hidden;box-shadow:0 0 0 10px var(--frame),0 0 0 11px var(--frame2),var(--shadow)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:100}
@media (max-width:440px){body{display:block}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}.island{display:none}}
#app{position:absolute;inset:0}

/* Screen scaffolding */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--s0)}
.scr.push{animation:pin .26s ease-out}.scr.pop{animation:pout .26s ease-out}.scr.fade{animation:fin .2s}
@keyframes pin{from{transform:translateX(30px);opacity:0}}
@keyframes pout{from{transform:translateX(-30px);opacity:0}}
@keyframes fin{from{opacity:0}}
.hd{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:56px 16px 8px;min-height:108px;flex:none}
.hd h1{text-align:center;font-size:17px;font-weight:600}
.hd.left{grid-template-columns:1fr auto;padding-left:20px}
.hd.left h1{text-align:left;font-size:24px;font-weight:700}
.hr{display:flex;gap:2px}
.hs{width:44px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;position:relative;color:var(--tx)}
.ib:hover{background:var(--s2)}
.ib.sm{width:36px;height:36px;border-radius:10px}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--ac);border:2px solid var(--s0)}
.ct{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;scrollbar-width:none}
.ct::-webkit-scrollbar{display:none}
.ct.top{padding-top:64px}
.ct>*{flex-shrink:0}
.ct>.grow{flex:1 0 auto}

/* Balance */
.lbl{color:var(--mu);font-size:13px}
.bal{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.bal small{font-size:15px;font-weight:600;color:var(--mu);letter-spacing:0}
.sub{color:var(--mu);font-size:13px;margin-top:2px}
.mut{color:var(--mu);font-size:12px}

/* Home hero */
.cmini{display:flex;align-items:center;gap:12px;margin-top:18px;padding:10px 12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);width:100%;text-align:left}
.cmini:hover{background:var(--s2)}
.mc{width:52px;height:34px;border-radius:6px;flex:none;display:flex;align-items:flex-end;justify-content:flex-end;padding:3px 5px;font-style:italic;font-weight:800;font-size:8px;position:relative;overflow:hidden}
.hero2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
.hb{transition:transform .1s,box-shadow .1s;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;text-align:left;min-height:116px;transition:transform .12s}
.hb:active{transform:translateY(4px)}
.hb>svg{margin-bottom:auto;width:42px;height:42px;padding:9px;border-radius:13px;background:rgba(255,255,255,.18)}
.hb.s>svg{background:var(--s0);box-shadow:inset 0 -3px 0 var(--acl)}
.hb b{font-size:15px;font-weight:700;margin-top:14px}
.hb small{font-size:12px;opacity:.8;line-height:1.3}
.hb.p{background:linear-gradient(180deg,#3D55FF,var(--ac));color:var(--onac);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 6px 0 var(--acsh)}
.hb.p:active{box-shadow:0 2px 0 var(--acsh)}
.hb.p:hover{filter:brightness(1.08)}
.hb.s{background:var(--acd);color:var(--act);border:1px solid var(--acl);box-shadow:0 6px 0 var(--acl)}
.hb.s:active{box-shadow:0 2px 0 var(--acl)}
.hb.s b{color:var(--tx)}.hb.s small{color:var(--mu);opacity:1}

/* Action tiles */
.acts{display:flex;justify-content:space-between;margin:20px 0 16px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;font-weight:600;width:76px}
.tsq{width:62px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,var(--t1),var(--t2));box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 5px 0 var(--t3),0 9px 14px -6px var(--t3);transition:transform .1s,box-shadow .1s;position:relative}
.tsq::after{content:"";position:absolute;left:9px;right:9px;top:5px;height:10px;border-radius:8px;background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,0))}
.tsq svg{position:relative;z-index:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.c-b{--t1:#4B63FF;--t2:#0500FF;--t3:#03009C}.c-v{--t1:#9B7BFF;--t2:#6A3DF0;--t3:#43209E}
.c-c{--t1:#4FD2FF;--t2:#0A9BE0;--t3:#05679A}.c-a{--t1:#FFC24D;--t2:#F28C00;--t3:#A85F00}.c-g{--t1:#4BE39A;--t2:#12B865;--t3:#0A7A43}
.tile:hover .tsq{filter:brightness(1.07)}
.tile:active .tsq{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 1px 0 var(--t3)}
.tile{gap:10px!important}
.tile[disabled]{opacity:.4;cursor:not-allowed}
.acts.four .tile{width:70px}.acts.four .tsq{width:60px}

/* Panels & rows */
.panel{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:6px 6px 8px}
.grow{flex:1;min-height:240px}
.ph{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 4px 12px}
.ph h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tx,.crow,.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:14px}
.tx:hover,.crow:hover{background:var(--s2)}
.txi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s3);flex:none}
.txi.payout{color:var(--act);background:var(--acd)}
.txm{flex:1;min-width:0;display:flex;flex-direction:column}
.txm b{font-weight:600;font-size:14px}
.txm small,.txr small{color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txr{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums;flex:none}
.txr b{font-size:14px;font-weight:600}
.pos{color:var(--pos)}
.txr small.pend{color:var(--warn)}
.coin{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.empty{color:var(--mu);text-align:center;padding:40px 0;font-size:14px}
.promo{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--acd);border:1px solid var(--acl);margin-bottom:12px;width:100%;text-align:left}
.promo small{color:var(--mu);white-space:normal}
.fab{position:absolute;right:16px;bottom:100px;width:52px;height:52px;border-radius:50%;background:var(--tx);color:var(--s0);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:5}

/* Tab bar */
.tb{display:flex;justify-content:space-between;padding:10px 14px 28px;border-top:1px solid var(--line);background:var(--s0);flex:none}
.tbi{position:relative;display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;color:var(--mu);font-size:13px;font-weight:500;min-height:40px}
.tbi span{display:none}.tbi.on span{display:inline}
.tbi:hover{color:var(--tx)}
.tbi.on{background:var(--acd);color:var(--act);box-shadow:inset 0 -2px 0 var(--acl);font-weight:700}
.tbi .dot{top:5px;right:7px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:16px;font-weight:600;flex:none}
.pri{background:var(--ac);color:var(--onac);box-shadow:0 4px 0 var(--acsh);transition:transform .1s,box-shadow .1s}
.pri:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acsh)}
.pri:hover{filter:brightness(1.08)}
.pri[disabled]{background:var(--s3);color:var(--mu);cursor:not-allowed;filter:none;box-shadow:none;transform:none}
.sec{background:var(--s2);border:1px solid var(--line);box-shadow:0 3px 0 var(--s3)}
.sec:active{transform:translateY(2px);box-shadow:0 1px 0 var(--s3)}
.sec:hover{background:var(--s3)}
.ghost{color:var(--mu);height:44px;font-size:14px}
.ghost:hover{color:var(--tx)}
.full{width:100%}
.foot{display:flex;gap:10px;padding:12px 16px 32px;flex:none}
.foot .btn{flex:1}
.link{color:var(--act);font-size:13px;font-weight:600}
.awb{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;border-radius:14px;background:#000;color:#fff;font-weight:600;width:100%;border:1px solid #000;margin-top:12px}
:root[data-theme="dark"] .awb{border-color:#3a3a3c}
.awb .wl{width:30px;height:22px;border-radius:5px;background:linear-gradient(180deg,#3DDC97 0 25%,#F2B544 25% 50%,#FF7A7A 50% 75%,#3AB8FF 75%);border:2px solid #fff}
.inwal{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;margin-top:10px;border-radius:12px;font-size:13px;font-weight:600;color:var(--pos);background:var(--posd)}

.sh{font-size:13px;color:var(--mu);font-weight:600;margin:20px 4px 8px}
.hint{font-size:13px;color:var(--mu);margin:-2px 4px 12px}
.list{display:flex;flex-direction:column;gap:2px}
.opt{background:var(--s1);border:1px solid var(--line);margin-bottom:8px;padding:14px}
.opt:hover{background:var(--s2)}
.ibox{width:40px;height:40px;border-radius:12px;background:var(--s3);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.09)}
.ibox.b{background:var(--acd);color:var(--act);box-shadow:inset 0 -3px 0 var(--acl)}
.eta{font-size:12px;color:var(--mu);white-space:nowrap}
.ttl{font-size:26px;font-weight:700;margin:0 4px 18px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-size:13px}
.note svg{flex:none;margin-top:1px}
.note.warn{border-color:var(--warnln);background:var(--warnbg);color:var(--warn)}
.note.blue{border-color:var(--acl);background:var(--acd);color:var(--act)}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);color:var(--mu)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx)}
.search:focus-within{border-color:var(--ac)}

/* Address */
.qr{align-self:center;position:relative;width:196px;height:196px;margin:20px 0 8px;border-radius:20px;background:#fff;padding:12px;border:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}
.qrc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:4px solid #fff;border-radius:50%;background:#fff}
.kv{display:flex;flex-direction:column;gap:4px;padding:12px 4px;border-bottom:1px solid var(--line)}
.kv small{color:var(--mu);font-size:12px}
.adr{display:flex;align-items:center;gap:8px}
.adr code{flex:1;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--tx)}

/* Swap */
.swbox{position:relative;display:flex;flex-direction:column;gap:6px}
.swr{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.swr.act{border-color:var(--acl)}
.swt,.swb{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu);min-height:24px}
.swm{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:10px}
.pill{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--s3);font-weight:600;flex:none}
.pill .coin{width:28px;height:28px;font-size:13px}
.amt{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.amt.dim{color:var(--mu)}
.max{padding:4px 10px;border-radius:8px;background:var(--s3);color:var(--tx);font-size:12px;font-weight:600}
.flip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:var(--s3);border:4px solid var(--s0);display:grid;place-items:center;z-index:1}
.rate{text-align:center;color:var(--mu);font-size:13px;margin:12px 0 4px}
.err{color:var(--err);font-size:13px;text-align:center;min-height:20px;margin-bottom:6px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:4px 8px 26px;flex:none}
.key{height:52px;font-size:24px;font-weight:500;border-radius:14px;display:grid;place-items:center}
.key:hover{background:var(--s1)}.key:active{background:var(--s2)}

/* Review / receipts */
.hero{text-align:center;padding:4px 0 18px;display:flex;flex-direction:column;gap:2px}
.hero small{color:var(--mu);font-size:13px}
.hero .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:8px}
.rows{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:2px 16px;margin-bottom:6px;width:100%}
.rw{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:14px;border-bottom:1px solid var(--line)}
.rw:last-child{border:0}
.rw span{color:var(--mu)}
.rw b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.rw.tot b{color:var(--pos);font-size:16px}
.center{align-items:center;justify-content:center;text-align:center}
.center h2{font-size:22px}
.ok{width:84px;height:84px;border-radius:50%;background:var(--posd);color:var(--pos);display:grid;place-items:center;margin-bottom:20px;animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.spin{width:56px;height:56px;border-radius:50%;border:4px solid var(--s3);border-top-color:var(--ac);animation:sp .9s linear infinite;margin-bottom:20px}
@keyframes sp{to{transform:rotate(360deg)}}
.steps{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:14px;text-align:left}
.steps li{display:flex;align-items:center;gap:12px;color:var(--mu)}
.steps li.cur,.steps li.done{color:var(--tx)}
.bul{width:22px;height:22px;border-radius:50%;border:2px solid var(--s3);display:grid;place-items:center;flex:none}
.done .bul{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.cur .bul{border-color:var(--ac)}

/* Card art — same in both themes */
.ca-blue{background:linear-gradient(135deg,#0500FF 0%,#2B4BFF 55%,#3AA0FF 100%);color:#fff}
.ca-gold{background:linear-gradient(135deg,#6e5018,#b98e38 48%,#d9b45f 62%,#87631f);color:#fff}
.ca-plat{background:linear-gradient(135deg,#7d848e,#d9dde2 45%,#a5abb4 70%,#6e757f);color:#0e1013}
.ca-obs{background:radial-gradient(120% 140% at 85% 0%,#2e3036 0%,#0b0b0d 55%);color:#e9e9ea;box-shadow:inset 0 0 0 1px #2c2e33}
.vcard{position:relative;height:212px;border-radius:22px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;flex:none;box-shadow:0 14px 30px -14px rgba(5,0,255,.35)}
.vcard::after,.mc::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;border:32px solid rgba(255,255,255,.1)}
.mc::after{right:-14px;top:-14px;width:40px;height:40px;border-width:6px}
.vc-top,.vc-bot{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;gap:12px}
.vc-top b{font-size:19px;font-weight:800}
.vc-bot{align-items:flex-end}
.visa{font-style:italic;font-weight:900;font-size:22px;letter-spacing:.02em}
.pan{font:600 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;position:relative;z-index:1}
.vc-bot small{display:block;font-size:11px;opacity:.75}
.vtag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.chipi{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#e9d38f,#b8964a);position:relative;z-index:1;margin-top:-30px}
.cp{padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.18);font-size:12px;font-weight:600;color:inherit}
.frost{position:absolute;inset:0;background:rgba(18,28,38,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;z-index:2;color:#c4e4ff;font-weight:600}

/* Profile */
.me{display:flex;align-items:center;gap:14px;padding:0 4px 18px}
.me>div{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--acd);color:var(--act);font-size:12px;font-weight:600;white-space:nowrap}
.badge.g{background:var(--posd);color:var(--pos)}
.menu{display:flex;flex-direction:column}
.mi{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:500;width:100%}
.mi span{flex:1}
.mi em{font-style:normal;color:var(--mu);font-size:13px}
.mi>svg:last-child{color:var(--mu)}
.mi.danger{color:var(--err);border:0}
.ref{margin-top:20px;padding:16px;border-radius:18px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.ref small{color:var(--mu);font-size:12px}
.ref p{color:var(--mu);font-size:13px;margin-bottom:10px}

/* Controls */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:13px;white-space:nowrap;min-height:36px}
.chip.on{background:var(--tx);color:var(--s0);border-color:var(--tx);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:18px}
.seg button{height:40px;border-radius:10px;font-weight:600;color:var(--mu)}
.seg .on{background:var(--s0);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13px;color:var(--mu)}
.fld input{height:50px;padding:0 14px;border-radius:14px;background:var(--s1);border:1px solid var(--line);outline:0;font-size:15px;color:var(--tx)}
.fld input:focus{border-color:var(--ac)}
.fld input::placeholder{color:var(--ph)}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line)}
.row>span:first-child{flex:1;display:flex;flex-direction:column;font-weight:500}
.row small{color:var(--mu);font-size:12px;font-weight:400}
.sw{width:46px;height:28px;border-radius:999px;background:var(--s3);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--ac)}
.sw.on::after{left:21px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--ph);flex:none}
.radio.on{border:7px solid var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac)}
.thm{width:40px;height:40px;border-radius:12px;flex:none;border:1px solid var(--line);overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.thm i:first-child{background:#fff}.thm i:last-child{background:#0A0B0D}
.thm.l i{background:#fff!important}.thm.d i{background:#0A0B0D!important}
.thm i{position:relative}
.thm i::after{content:"";position:absolute;left:5px;right:5px;bottom:7px;height:4px;border-radius:2px;background:#0500FF}

/* Sheet & toast */
#sheet{position:absolute;inset:0;z-index:40;pointer-events:none}
#sheet.open{pointer-events:auto}
.sbk{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
#sheet.open .sbk{opacity:1}
.sbody{position:absolute;left:0;right:0;bottom:0;background:var(--s0);border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:10px 16px 34px;transform:translateY(100%);transition:transform .26s ease-out;max-height:84%;overflow-y:auto}
#sheet.open .sbody{transform:none}
.grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--s3);margin:0 auto 14px}
.sbody h3{font-size:18px;font-weight:700}
.shd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.shd small{color:var(--mu);font-size:13px}
.limv{font-size:30px;font-weight:700;text-align:center;margin:8px 0 12px;font-variant-numeric:tabular-nums}
#toast{position:absolute;left:50%;bottom:118px;transform:translate(-50%,16px);background:var(--tx);color:var(--s0);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:70;pointer-events:none;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Game layer ===== */
.up{text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.lvstrip{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);width:100%;text-align:left;margin-bottom:14px}
.lvstrip:hover{background:var(--s2)}
.lvb{font-size:11px;font-weight:800;letter-spacing:.08em;padding:4px 7px;border-radius:6px;background:var(--acd);color:var(--act);flex:none}
.bar{flex:1;height:6px;border-radius:3px;background:var(--s3);overflow:hidden;display:block}
.bar i{display:block;height:100%;border-radius:3px;background:var(--grad);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gem{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.gem svg{color:var(--act)}
.pc{position:relative;padding:16px 16px 14px;background:var(--s1);border:1px solid var(--line);clip-path:polygon(0 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%);border-radius:6px 6px 0 6px}
.pc::before{content:"";position:absolute;left:0;top:0;width:72px;height:3px;background:var(--grad)}
.pch{display:flex;align-items:center;gap:14px}
.orb{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7d8cff,#0500FF 55%,#02006b);flex:none;position:relative;display:block}
.orb b{position:absolute;right:-6px;bottom:-4px;font-size:10px;font-weight:800;background:var(--tx);color:var(--s0);border-radius:6px;padding:1px 5px;z-index:1}
.orb.fr-prism::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid;border-color:#0500FF #3AB8FF #3DDC97 #F2C14E}
.pcn{flex:1;min-width:0;display:flex;flex-direction:column}
.pcn b{font-size:20px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.tier{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--act)}
.pcb{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--mu)}
.pcs{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.exp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.ex b{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:5px}
.ex b svg{color:var(--act)}
.ex small{font-size:11px;color:var(--mu);line-height:1.35}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:28px 2px 10px;gap:8px}
.gh h2{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.gh small{font-size:11px;color:var(--mu);font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.gh small em{font-style:normal;color:var(--act);font-size:13px}
.track{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory;flex:none}
.track::-webkit-scrollbar{display:none}
.node{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;scroll-snap-align:start}
.art{width:112px;height:112px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.node.lock .art>*:first-child{opacity:.4;filter:grayscale(.6)}
.lkb{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:7px;background:var(--s3);display:grid;place-items:center;color:var(--mu)}
.nm{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;text-align:center;margin:8px 0;min-height:28px;line-height:1.25}
.nl{position:relative;width:100%;height:28px;display:grid;place-items:center}
.nl::before{content:"";position:absolute;left:-5px;right:-5px;top:13px;height:2px;background:var(--s3)}
.node.got .nl::before{background:var(--grad)}
.node:first-child .nl::before{left:50%}.node:last-child .nl::before{right:50%}
.num{position:relative;width:28px;height:28px;border-radius:50%;background:var(--s0);border:2px solid var(--s3);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--mu)}
.node.got .num{border-color:var(--ac);color:var(--tx);box-shadow:0 0 12px rgba(5,0,255,.3)}
.st{font-size:10px;color:var(--mu);margin-top:8px;text-align:center;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px}
.st b{color:var(--tx);font-size:15px;letter-spacing:0}
.st.okc{color:var(--pos);flex-direction:row;gap:4px;font-size:11px;text-transform:none;letter-spacing:0}
.clm{margin-top:8px;height:28px;padding:0 14px;border-radius:8px;background:var(--ac);color:var(--onac);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(5,0,255,.18)}}
.gemart{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--act);font-weight:800;font-size:14px}
.tkt{padding:10px 12px;border:1.5px dashed var(--act);border-radius:8px;color:var(--act);font-weight:900;font-size:14px;text-align:center;line-height:1.15}
.limart{display:flex;flex-direction:column;align-items:center;font-weight:900;font-size:22px;color:var(--act);line-height:1.1}
.limart small{font-size:9px;letter-spacing:.1em;color:var(--mu);margin-top:4px}
.ringart{width:60px;height:60px;border-radius:50%;border:3px solid;border-color:#0500FF #3AB8FF #3DDC97 #F2C14E;background:radial-gradient(circle at 35% 30%,#7d8cff,#0500FF 55%,#02006b)}
.bst{font-size:40px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.qtart{font-style:italic;font-size:12px;padding:10px;text-align:center;line-height:1.3}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:var(--onac);font-size:11px;font-weight:800;margin-left:6px;padding:0 5px}
.chip.on .cnt{background:var(--s0);color:var(--act)}
.qreset{font-size:11px;color:var(--mu);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:-2px 2px 10px}
.q{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px}
.qc{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--ph);display:grid;place-items:center;flex:none;color:var(--onac)}
.q.done .qc{background:var(--ac);border-color:var(--ac)}
.q.ready{border-color:var(--acl)}
.qm{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qm b{font-size:13px;font-weight:500;line-height:1.3}
.q.done .qm b{color:var(--mu);text-decoration:line-through}
.qp{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mu);font-variant-numeric:tabular-nums}
.qp .bar{height:4px;flex:none;width:84px}
.qr2{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.xp{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.xp small{font-size:9px;color:var(--mu);letter-spacing:.08em;margin-left:3px}
.xp.gm{color:var(--act)}
.qbtn{height:26px;padding:0 10px;border-radius:7px;background:var(--ac);color:var(--onac);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.qok{font-size:11px;color:var(--pos);font-weight:700}
.store{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.si{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.si:hover{background:var(--s2)}
.si.feat{grid-column:span 2;flex-direction:row;align-items:center;background:var(--acd);border-color:var(--acl)}
.si.feat .txm small{white-space:normal}
.si b{font-size:13px;font-weight:600}
.si small{font-size:11px;color:var(--mu);line-height:1.35;flex:1}
.si[aria-disabled=true]{opacity:.55}
.lvup{text-align:center;padding:8px 0 0;display:flex;flex-direction:column;align-items:center}
.lvbig{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:46px;font-weight:900;color:#fff;background:radial-gradient(circle at 35% 30%,#7d8cff,#0500FF 55%,#02006b);box-shadow:0 0 40px -4px #0500FF;margin:10px 0 18px;animation:pop .5s ease-out}
.xpchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--acd);color:var(--act);font-weight:800;font-size:13px;margin:-8px 0 18px}
.how{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.how:last-of-type{border:0}
.how p{font-size:13px;color:var(--mu);margin-top:2px}

.gbig{width:56px;height:56px;border-radius:16px;background:var(--acd);color:var(--act);display:grid;place-items:center;flex:none}
.earn{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.earn span{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--s0);border:1px solid var(--line);font-size:12px;color:var(--mu)}
.earn svg{color:var(--act)}
.orb.fr-gold::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid #d9b45f}
.gneg{color:var(--mu)}
/* Gem counter + brand */
.gchip{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 12px 0 8px;border-radius:999px;background:var(--s1);border:1px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;margin-right:4px;transition:transform .1s,box-shadow .1s}
.gchip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.hd.left .hr{align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.blogo{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#4B63FF,#0500FF 60%,#0300B0);display:grid;place-items:center;box-shadow:0 3px 0 var(--acsh);flex:none}
.blogo svg{width:22px;height:22px}
.gbig2{width:64px;height:64px;border-radius:18px;background:var(--acd);display:grid;place-items:center;box-shadow:inset 0 -4px 0 var(--acl);flex:none}

/* App Library launcher */
#launch{position:absolute;inset:0;z-index:80;padding:62px 22px 30px;background:var(--wall);color:var(--wtx);transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .35s;overflow:hidden}
#launch.dim{transform:scale(.93);opacity:.5}
#launch.hide{opacity:0;transform:scale(1.08);pointer-events:none}
.sbar{position:absolute;top:18px;left:38px;right:30px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px}
.lsearch{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:12px;background:var(--fold);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:16px;opacity:.85;margin:4px 0 22px}
.folds{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.fold{background:var(--fold);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{text-align:center;font-size:12px;font-weight:600;margin-top:6px;opacity:.85}
.appi{aspect-ratio:1;width:100%;border-radius:23%;display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);position:relative}
.appi svg{width:48%;height:48%}
.appi.ex{background:linear-gradient(145deg,#4B63FF,#0500FF 60%,#0300B0);animation:hint 2.4s ease-in-out infinite}
.appi.ex svg{width:62%;height:62%}
@keyframes hint{0%,100%{box-shadow:0 2px 6px rgba(0,0,0,.15),0 0 0 0 rgba(75,99,255,.55)}50%{box-shadow:0 2px 6px rgba(0,0,0,.15),0 0 0 7px rgba(75,99,255,0)}}
.appi.wig{animation:wig .35s}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
#zoom{position:absolute;z-index:90;display:none;background:linear-gradient(160deg,#4B63FF,#0500FF 55%,#0300B0);overflow:hidden}
#zoom.on{display:block}
.zlogo{position:absolute;left:50%;top:50%;width:62%;max-width:104px;transform:translate(-50%,-50%);transition:top .5s cubic-bezier(.2,.9,.25,1);z-index:2}
.zlogo svg{display:block;width:100%;height:auto}
#zoom.splash .zlogo{top:43%;animation:zpop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes zpop{0%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-50%) scale(1.22) rotate(-4deg)}100%{transform:translate(-50%,-50%) scale(1)}}
.zword{position:absolute;left:0;right:0;top:55%;text-align:center;color:#fff;font-size:38px;font-weight:800;letter-spacing:.02em;opacity:0;transform:translateY(14px);transition:all .45s .2s}
.zsub{position:absolute;left:0;right:0;top:calc(55% + 50px);text-align:center;color:#fff;font-size:15px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:opacity .45s .4s}
#zoom.splash .zword{opacity:1;transform:none}#zoom.splash .zsub{opacity:.75}
.zring{position:absolute;left:50%;top:43%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.5);opacity:0}
#zoom.splash .zring{animation:ring 1.2s ease-out forwards}#zoom.splash .zring.r2{animation-delay:.25s}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(3.4);opacity:0}}
.zp{position:absolute;left:50%;top:43%;width:14px;height:14px;margin:-7px 0 0 -7px;opacity:0}
#zoom.splash .zp{animation:burst .9s .1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(160deg);opacity:0}}
#zoom.out{opacity:0;transition:opacity .4s!important}
#hbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--tx);opacity:.85;z-index:75}
#hbar::before{content:"";position:absolute;inset:-12px -20px}
/* Membership */
.mprog{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin:14px 0 4px}
.mprog .bar{height:8px;margin:12px 0 0;position:relative;overflow:visible}
.tick{position:absolute;top:-3px;width:2px;height:14px;background:var(--line)}
.ticks{position:relative;height:18px;font-size:10px;color:var(--mu);font-weight:700;margin-top:6px}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:last-child{transform:translateX(-100%)}
.mt{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:10px;background:var(--s1)}
.mt.cur{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.mth{display:flex;align-items:center;gap:12px}
.mth .mc{width:60px;height:40px}
.mt ul{list-style:none;margin:12px 0 0;display:grid;gap:6px;font-size:13px;color:var(--mu)}
.mt li{display:flex;gap:8px;align-items:flex-start}
.mt li svg{color:var(--act);flex:none;margin-top:2px}
.mt .btn{height:44px;margin-top:12px;width:100%}
.prk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.prk div{background:var(--s0);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column}
.prk small{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.prk b{font-size:14px;font-variant-numeric:tabular-nums}
.big3d{height:200px;margin:4px 0 0}
/* =====================================================================
   QUIET LUXURY LAYER — visual overrides only. All logic untouched.
   ===================================================================== */
:root{
  --page:#E8E6E0;--s0:#F7F6F2;--s1:#FFFFFF;--s2:#F0EEE8;--s3:#E4E1D9;--line:#E2DFD6;--tx:#16171A;--mu:#6B6C72;--ph:#8E8F95;
  --ac:#16171A;--act:#8A7444;--acd:#F3EEE2;--acl:#DDD1B4;--onac:#F7F6F2;--acsh:transparent;--champ:#8A7444;
  --pos:#2F7D57;--posd:#E7F0EA;--warn:#8F6A1F;--warnbg:#F7F1E3;--warnln:#E6D8B6;--err:#B23A3A;--gold:#8A7444;
  --grad:linear-gradient(90deg,#8A7444,#B9A577);
  --frame:#D8D5CD;--frame2:#C8C4BA;--shadow:0 30px 60px rgba(30,25,15,.14);--scrim:rgba(11,12,14,.35);
  --wall:linear-gradient(165deg,#e7e4dc 0%,#f4f2ed 50%,#e2dfd8 100%);--wtx:#16171A;--fold:rgba(255,255,255,.6)}
:root[data-theme="dark"]{
  --page:#050506;--s0:#0B0C0E;--s1:#121417;--s2:#181A1E;--s3:#22252A;--line:#292B30;--tx:#F3F2EE;--mu:#9B9CA2;--ph:#707178;
  --ac:#C7B58B;--act:#C7B58B;--acd:#1A1814;--acl:#3B3527;--onac:#0B0C0E;--acsh:transparent;--champ:#C7B58B;
  --pos:#86B99C;--posd:#14201A;--warn:#C9A961;--warnbg:#1A1710;--warnln:#3A3220;--err:#D2817A;--gold:#C7B58B;
  --grad:linear-gradient(90deg,#8F7F5C,#C7B58B);
  --frame:#141518;--frame2:#25272C;--shadow:0 40px 80px rgba(0,0,0,.6);--scrim:rgba(0,0,0,.6);
  --wall:linear-gradient(165deg,#1b1c20 0%,#0e0f11 55%,#060607 100%);--wtx:#F3F2EE;--fold:rgba(255,255,255,.06)}

body{letter-spacing:.005em}
:focus-visible{outline-color:var(--champ)}
/* Type */
.hd{min-height:104px}
.hd h1{font-weight:500}
.hd.left h1{font-size:22px;font-weight:500;letter-spacing:-.005em}
.lbl{font-size:13px;color:var(--mu);letter-spacing:.02em}
.bal{font-size:46px;font-weight:500;letter-spacing:-.025em;margin-top:4px}
.bal small{font-size:15px;font-weight:400;color:var(--mu)}
.sub{font-variant-numeric:tabular-nums;margin-top:4px}
.up{text-transform:none;letter-spacing:0;font-weight:500}
.ttl,.center h2,.hero .big,.limv,.amt{font-weight:500}
.sh{font-weight:500;letter-spacing:.02em}
.key{font-weight:400}
.dot{background:var(--champ)}
.ib:hover{background:var(--s1)}

/* Brand + compact counter */
.brand{font-weight:500}
.blogo{width:32px;height:32px;border-radius:10px;background:var(--s1);border:1px solid var(--line);box-shadow:none;color:var(--champ)}
.blogo svg{width:18px;height:18px}
.gchip{height:32px;padding:0 12px 0 10px;background:transparent;border:1px solid var(--line);box-shadow:none;font-size:14px;font-weight:500;gap:6px}
.gchip:hover{background:var(--s1)}
.gchip:active{transform:none;box-shadow:none}

/* Card preview + primary actions */
.cmini{background:var(--s1);border-color:var(--line);border-radius:16px;padding:12px 16px;margin-top:24px}
.cmini:hover{background:var(--s2)}
.hero2{gap:8px;margin:8px 0}
.hb,.hb.p,.hb.s{background:var(--s1);color:var(--tx);border:1px solid var(--line);box-shadow:none;border-radius:16px;min-height:112px;padding:16px}
.hb:hover,.hb.p:hover{background:var(--s2);filter:none}
.hb:active,.hb.p:active,.hb.s:active{transform:none;box-shadow:none;background:var(--s3)}
.hb>svg,.hb.s>svg{width:40px;height:40px;padding:10px;border-radius:12px;background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--champ)}
.hb b{font-weight:500;font-size:15px;margin-top:16px}
.hb.s b{color:var(--tx)}
.hb small,.hb.s small{color:var(--mu);opacity:1}

/* Shortcuts — outline, neutral */
.acts{margin:24px 8px}
.tile{font-weight:400;color:var(--mu);gap:8px!important}
.c-b,.c-v,.c-c,.c-a,.c-g{--t1:var(--s1);--t2:var(--s1);--t3:transparent}
.tsq,.acts.four .tsq{width:56px;height:56px;border-radius:16px;background:var(--s1);border:1px solid var(--line);box-shadow:none;color:var(--tx)}
.tsq::after{display:none}
.tsq svg{filter:none}
.tile:hover .tsq{filter:none;background:var(--s2)}
.tile:active .tsq{transform:none;box-shadow:none;background:var(--s3)}

/* Surfaces, rows, dividers */
.panel{background:var(--s1);border-color:var(--line);border-radius:20px;padding:8px 8px 4px}
.ph{padding:8px 8px 8px 12px}
.ph h2,.gh h2{text-transform:none;letter-spacing:0;font-weight:500;font-size:15px}
.gh{margin:32px 4px 12px}.gh h2{font-size:17px}
.gh small{text-transform:none;letter-spacing:.02em;font-weight:400}
.panel .list .tx{border-radius:0;border-bottom:1px solid var(--line);padding:14px 8px}
.panel .list .tx:last-child{border-bottom:0}
.panel .list .tx:hover{background:transparent}
.txi{background:transparent;border:1px solid var(--line);color:var(--mu)}
.txi.payout{background:transparent;color:var(--champ)}
.txm b,.txr b,.rw b{font-weight:500}
.ibox,.ibox.b{background:transparent;border:1px solid var(--line);box-shadow:none}
.ibox{color:var(--mu)}.ibox.b{color:var(--champ)}
.opt{background:var(--s1);border-color:var(--line);border-radius:16px}
.opt:hover{background:var(--s2)}
.rows{background:var(--s1);border-radius:16px}
.note,.note.blue{background:var(--s1);border-color:var(--line);color:var(--mu);border-radius:16px}
.badge{background:transparent;border:1px solid var(--acl);color:var(--champ);font-weight:500}
.badge.g{border-color:var(--line);color:var(--pos)}
.fab{width:48px;height:48px;background:var(--s2);color:var(--tx);border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.18)}

/* Quiet status card (was the Gold banner) */
.promo{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px}
.promo b{font-weight:500}
.promo:hover{border-color:var(--acl)}

/* Bottom navigation */
.tb{padding:8px 16px 28px}
.tbi,.tbi.on{background:transparent;box-shadow:none;color:var(--ph)}
.tbi.on{color:var(--tx);font-weight:500}
.tbi.on::after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--champ);transform:translateX(-50%)}

/* Buttons */
.btn{border-radius:16px;font-weight:500}
.pri,.pri:active{box-shadow:none;transform:none}
.pri:hover{filter:none;opacity:.92}
.pri:active{opacity:.85}
.sec,.sec:active{background:transparent;border:1px solid var(--line);box-shadow:none;transform:none}
.sec:hover{background:var(--s1)}
.link{color:var(--champ);font-weight:500}
.awb{border-radius:16px;font-weight:500}
.inwal{background:transparent;border:1px solid var(--line);color:var(--pos);font-weight:500;border-radius:16px}
.seg .on{box-shadow:none;background:var(--s2)}
.fld input{border-radius:16px}
.fld input:focus,.search:focus-within{border-color:var(--champ)}

/* Card — understated blue-black, muted tiers */
.vcard{box-shadow:none;border-radius:20px}
.vcard::after,.mc::after{border-color:rgba(255,255,255,.035)}
.ca-blue{background:linear-gradient(140deg,#1b2233 0%,#111624 55%,#0a0d15 100%);color:#EDEBE5;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.ca-gold{background:linear-gradient(140deg,#2c2619,#1b1813 60%,#121010);color:#E6D9B8;box-shadow:inset 0 0 0 1px rgba(199,181,139,.28)}
.ca-plat{background:linear-gradient(140deg,#3b3d42,#27292d 55%,#1b1c1f);color:#EDEDEA;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.ca-obs{background:linear-gradient(140deg,#151517,#09090a);color:#D8D5CC;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.vc-top b{font-weight:500;letter-spacing:.02em}
.vtag{font-weight:500;letter-spacing:.14em;opacity:.7}
.visa{font-weight:700;opacity:.9}
.chipi{background:linear-gradient(135deg,#d8c79d,#a38f5f);opacity:.8}
.cp{background:rgba(255,255,255,.08)}
.frost{background:rgba(11,12,14,.7);color:#F3F2EE}

/* Progress, toggles, states */
.bar{height:3px;border-radius:2px}
.bar i{background:var(--champ);border-radius:2px}
.mprog{border-radius:16px;background:var(--s1)}
.tick{background:var(--s3)}
.sw.on{background:var(--champ)}
.radio.on{border-color:var(--champ)}
.spin{border-top-color:var(--champ)}
.done .bul{background:var(--champ);border-color:var(--champ);color:var(--s0)}
.cur .bul{border-color:var(--champ)}
.ok{background:transparent;border:1px solid var(--line);color:var(--pos)}
.chip{border-radius:999px}
.mt{border-radius:16px}
.mt.cur{border-color:var(--acl);box-shadow:none}
.mt li svg{color:var(--champ)}
.prk div{background:var(--s0);border-radius:12px}
.si,.si.feat{border-radius:16px;background:var(--s1);border-color:var(--line)}
.si.feat{border-color:var(--acl)}
.si:hover{background:var(--s2)}
.gbig2{background:transparent;border:1px solid var(--line);box-shadow:none}
.pc{clip-path:none;border-radius:20px;padding:20px}
.pc::before{display:none}
.earn span{background:transparent}
.thm i::after{background:#C7B58B}
.lvbig{background:var(--s1);color:var(--champ);box-shadow:0 0 0 1px var(--acl);animation:none}

/* Launcher & opening — restrained */
.appi.ex{background:linear-gradient(145deg,#1f2126,#0B0C0E);color:#C7B58B;animation:none;box-shadow:0 2px 6px rgba(0,0,0,.2),inset 0 0 0 1px rgba(199,181,139,.25)}
#zoom{background:#0B0C0E;color:#C7B58B}
.zlogo{max-width:64px}
#zoom.splash .zlogo{animation:none}
.zword{font-size:28px;font-weight:500;color:#F3F2EE;letter-spacing:.04em}
.zsub{color:#9B9CA2;font-size:11px;letter-spacing:.28em}
#zoom.splash .zsub{opacity:1}
.zring,.zp{display:none}

.prk small{text-transform:none;letter-spacing:.01em;font-weight:400}

/* =====================================================================
   MOODBOARD LAYER — monochrome black, graphite and brushed silver.
   Visual overrides only. Icons: SF Symbols style. Type: Jost.
   ===================================================================== */
:root{
  --page:#D6D6DB;--s0:#F2F2F4;--s1:#FFFFFF;--s2:#EAEAED;--s3:#DCDCE0;--line:#E1E1E5;--tx:#0A0A0B;--mu:#6C6C70;--ph:#9A9AA0;
  --ac:#0A0A0B;--act:#3A3A3C;--acd:#ECECEF;--acl:#CDCDD2;--onac:#FFFFFF;--champ:#3A3A3C;
  --pos:#2E7A4F;--posd:#E6F0EA;--warn:#8A6A26;--warnbg:#F5F1E6;--warnln:#E3D8BE;--err:#B3392F;--gold:#3A3A3C;
  --grad:linear-gradient(90deg,#3A3A3C,#8E8E93);
  --chrome:linear-gradient(135deg,#f4f5f7 0%,#9a9da3 28%,#e9eaed 50%,#7b7e84 75%,#d7d9dd 100%);
  --frame:#C9C9CE;--frame2:#B5B5BB;--shadow:0 30px 60px rgba(0,0,0,.18);--scrim:rgba(0,0,0,.35);
  --wall:linear-gradient(170deg,#ececef 0%,#dcdce0 55%,#cfcfd4 100%);--wtx:#0A0A0B;--fold:rgba(255,255,255,.55);
  --glass:rgba(255,255,255,.86)}
:root[data-theme="dark"]{
  --page:#000000;--s0:#050506;--s1:#0E0E10;--s2:#151517;--s3:#1F1F22;--line:#1E1E21;--tx:#F5F5F7;--mu:#8E8E93;--ph:#5A5A5F;
  --ac:#F5F5F7;--act:#D1D3D8;--acd:#141416;--acl:#2E2E33;--onac:#000000;--champ:#C8CBD0;
  --pos:#7FC79A;--posd:#0F1A13;--warn:#D4B06A;--warnbg:#16130C;--warnln:#3A3221;--err:#E07A72;--gold:#C8CBD0;
  --grad:linear-gradient(90deg,#6E7075,#D1D3D8);
  --frame:#0C0C0D;--frame2:#232326;--shadow:0 40px 90px rgba(0,0,0,.75);--scrim:rgba(0,0,0,.6);
  --wall:linear-gradient(170deg,#1b1b1e 0%,#0a0a0b 55%,#000 100%);--wtx:#F5F5F7;--fold:rgba(255,255,255,.07);
  --glass:rgba(14,14,16,.86)}

/* Brand mark — brushed silver E on black */
.blogo{background:#0A0A0B;border:1px solid #2A2A2E;color:#DADCE0}
.appi.ex{background:linear-gradient(150deg,#2b2c30 0%,#0b0b0c 55%,#000 100%);color:#E3E4E7;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.14)}
#zoom{background:radial-gradient(120% 70% at 50% 40%,#1a1a1d 0%,#050506 55%,#000 100%);color:#E3E4E7}
.zword{color:#F5F5F7}.zsub{color:#8E8E93}

/* Silver detail colour */
.gem svg,.gchip svg{color:var(--champ)}
.tbi.on::after{background:var(--tx)}
.tbi.on{color:var(--tx)}
.tbi{color:var(--ph)}

/* Primary action surface — slightly lifted, like brushed metal */
.hb.p{background:var(--s2);border-color:var(--acl)}
.hb.p>svg{color:var(--tx);border-color:var(--acl)}
.hb.s>svg,.hb>svg{color:var(--champ)}

/* Glass sheets (moodboard widgets) */
.sbody{background:var(--glass);backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2)}

/* Cards — black leather, brushed steel, titanium, obsidian */
.ca-blue{background:
  linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 32%),
  linear-gradient(140deg,#1a1c21 0%,#0c0d10 55%,#040405 100%);color:#F2F2F4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.ca-gold{background:
  linear-gradient(115deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 30%),
  linear-gradient(140deg,#2b261e 0%,#15130f 58%,#090807 100%);color:#E4D9C2;box-shadow:inset 0 0 0 1px rgba(228,217,194,.18)}
.ca-plat{background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,0) 1px 3px),
  linear-gradient(135deg,#8b8e94 0%,#cfd2d7 38%,#a2a5ab 60%,#6d7076 100%);color:#0D0E10;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.ca-obs{background:radial-gradient(120% 90% at 82% 0%,#2a2b2f 0%,#0a0a0b 45%,#000 100%);color:#E9E9EB;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.vcard::after,.mc::after{border-color:rgba(255,255,255,.03)}
.chipi{background:var(--chrome);opacity:.85}
.visa{opacity:.92}
.ca-blue .visa,.ca-obs .visa{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Controls & states in monochrome */
.sw.on{background:var(--tx)}.sw.on::after{background:var(--s0)}
.radio.on{border-color:var(--tx)}
.bar i{background:var(--tx)}
.spin{border-top-color:var(--tx)}
.done .bul{background:var(--tx);border-color:var(--tx);color:var(--s0)}
.cur .bul{border-color:var(--tx)}
.badge{border-color:var(--acl);color:var(--act)}
.link{color:var(--act)}
.mt li svg{color:var(--mu)}
.fld input:focus,.search:focus-within{border-color:var(--tx)}
.thm i::after{background:#8E8E93}
.dot{background:var(--tx)}

/* =====================================================================
   v8 — CRINX brand, standout app icon, Face ID, calm home, tab bar
   ===================================================================== */
/* Wordmark: CRINX in Jost capitals */
.wm{font-family:Jost,system-ui,sans-serif;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.hd.left h1.wm{font-size:20px;padding-left:.05em}
.vc-top b{letter-spacing:.24em;font-weight:500;font-size:15px}

/* App Library — the only monochrome icon, with a moving chrome sheen and a soft silver halo */
.appi.ex{background:radial-gradient(130% 120% at 30% 0%,#26272b 0%,#050506 55%,#000 100%)!important;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.2),0 8px 18px rgba(0,0,0,.5),0 0 0 0 rgba(222,226,233,0)!important;animation:crxh 3.6s ease-in-out infinite!important}
.appi.ex::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 48%,rgba(255,255,255,.08) 56%,transparent 68%);transform:translateX(-130%);animation:crxs 3.6s ease-in-out infinite;pointer-events:none}
.appi.ex::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.06);pointer-events:none}
.wmk{position:relative;z-index:1;font:600 10.5px/1 Jost,system-ui,sans-serif;letter-spacing:.16em;padding-left:.16em;
  background:linear-gradient(180deg,#ffffff 0%,#b9bdc4 48%,#7f838a 52%,#eceef1 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes crxs{0%,50%{transform:translateX(-130%)}80%,100%{transform:translateX(130%)}}
@keyframes crxh{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.2),0 8px 18px rgba(0,0,0,.5),0 0 0 0 rgba(222,226,233,0)}
  50%{box-shadow:0 0 0 1px rgba(255,255,255,.32),0 8px 18px rgba(0,0,0,.5),0 0 22px 2px rgba(222,226,233,.38)}}
:root:not([data-theme="dark"]) .appi.ex{box-shadow:0 0 0 1px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35)!important}

/* Splash — chrome wordmark */
#zoom .zmk{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;font:500 44px/1 Jost,system-ui,sans-serif;letter-spacing:.6em;padding-left:.6em;opacity:0;
  background:linear-gradient(100deg,#8a8e95 0%,#f5f6f8 35%,#9a9ea5 50%,#ffffff 62%,#8a8e95 100%);background-size:250% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
  transition:opacity .5s .05s,letter-spacing .9s cubic-bezier(.2,.8,.2,1),padding .9s cubic-bezier(.2,.8,.2,1)}
#zoom.splash .zmk{opacity:1;letter-spacing:.3em;padding-left:.3em;animation:zsh 1.6s .25s ease-in-out forwards}
@keyframes zsh{to{background-position:0 0}}
#zoom .zln{position:absolute;left:50%;top:calc(46% + 38px);width:0;height:1px;background:linear-gradient(90deg,transparent,#c8cbd0,transparent);transform:translateX(-50%);transition:width .8s .35s cubic-bezier(.2,.8,.2,1)}
#zoom.splash .zln{width:120px}
#zoom .zsub{top:calc(46% + 56px)!important;opacity:0;transition:opacity .5s .6s}
#zoom.splash .zsub{opacity:1}

/* Home — card as hero, no transaction list */
.hcard{display:block;width:100%;margin-top:22px;text-align:left;border-radius:20px;transition:transform .2s}
.hcard:active{transform:scale(.985)}
.hcard .vcard{height:188px}
.orb{background:radial-gradient(circle at 35% 28%,#f2f3f5 0%,#9a9ea5 30%,#2a2b2f 68%,#050506 100%)!important}
.hcs{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mu);margin:12px 0 10px}
.hcs svg{color:var(--champ)}

/* Bottom navigation — fixed slots, sliding highlight */
.tb{position:relative;display:grid!important;grid-template-columns:repeat(4,1fr);padding:8px 12px 28px!important}
.tbi{flex-direction:column;justify-content:center;gap:3px;height:52px;padding:0!important;border-radius:16px;font-size:11px;min-height:0;width:100%;z-index:1;transition:color .3s}
.tbi span{display:block!important}
.tbi.on::after{display:none!important}
.tind{position:absolute;top:8px;left:12px;width:calc((100% - 24px)/4);height:52px;border-radius:16px;background:var(--s2);border:1px solid var(--line);z-index:0;
  transform:translateX(calc(var(--to)*100%));animation:tind .5s cubic-bezier(.3,1.2,.4,1)}
@keyframes tind{from{transform:translateX(calc(var(--from)*100%))}}
.tb.mv .tbi.on svg{animation:tpop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes tpop{0%{transform:scale(.75)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.scr.fade{animation:none}
.scr.fade .ct,.scr.fade .hd{animation:fin .28s ease-out}

/* Face ID — expands from the Dynamic Island */
#fid{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:101;display:none;overflow:hidden;
  box-shadow:0 0 0 0 rgba(0,0,0,0);transition:width .5s cubic-bezier(.3,1.25,.45,1),height .5s cubic-bezier(.3,1.25,.45,1),margin .5s cubic-bezier(.3,1.25,.45,1),border-radius .5s cubic-bezier(.3,1.25,.45,1),box-shadow .4s}
#fid.on{display:block}
#fid.open{width:156px;height:156px;margin-left:-78px;border-radius:46px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.fidg{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;color:#fff;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.3,1.4,.5,1)}
#fid.open .fidg{opacity:1;transform:scale(1);transition-delay:.18s}
#fid.shut .fidg{opacity:0;transform:scale(.6);transition-delay:0s}
.fidg svg{position:absolute;inset:0;width:100%;height:100%}
.fface{animation:fpulse 1s ease-in-out infinite}
@keyframes fpulse{50%{opacity:.5}}
.scanl{position:absolute;left:-8px;right:-8px;top:0;height:12px;border-radius:6px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.6),transparent);animation:fscan .7s ease-in-out infinite alternate}
@keyframes fscan{to{top:52px}}
.fchk{opacity:0}
.fchk circle,.fchk path{stroke-dasharray:170;stroke-dashoffset:170}
#fid.fok .fface,#fid.fok .scanl{opacity:0;animation:none;transition:opacity .2s}
#fid.fok .fchk{opacity:1}
#fid.fok .fchk circle{animation:draw .45s ease-out forwards}
#fid.fok .fchk path{animation:draw .35s .25s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#fid.fok .fchk circle,#fid.fok .fchk path{stroke-dashoffset:0!important}#zoom.splash .zmk{background-position:0 0}}

/* =====================================================================
   v9 — Dynamic Island Face ID, muted App Library, card flip, home actions
   ===================================================================== */
/* Muted App Library: neutral tones so only CRINX catches the eye */
.appi.mute{color:var(--mg);box-shadow:none}
.appi.mute.t0{background:var(--m0)}.appi.mute.t1{background:var(--m1)}.appi.mute.t2{background:var(--m2)}.appi.mute.t3{background:var(--m3)}
:root{--m0:linear-gradient(160deg,#dfdfe3,#cfcfd4);--m1:linear-gradient(160deg,#d3d3d8,#c2c2c8);--m2:linear-gradient(160deg,#e7e7ea,#d8d8dc);--m3:linear-gradient(160deg,#c9c9ce,#b8b8be);--mg:#5c5d63}
[data-theme="dark"]{--m0:linear-gradient(160deg,#3a3b3f,#2c2d31);--m1:linear-gradient(160deg,#2f3034,#232427);--m2:linear-gradient(160deg,#45464a,#35363a);--m3:linear-gradient(160deg,#28292c,#1d1e21);--mg:#a3a5ab}

/* Card flip */
.vflip{perspective:1400px;height:212px;flex:none;position:relative}
.vc-in{position:relative;height:100%;transform-style:preserve-3d;transform:rotateY(0deg)}
.vflip.flipd .vc-in{transform:rotateY(180deg)}
.vflip.anim.flipd .vc-in{animation:flipon .7s cubic-bezier(.35,.1,.25,1)}
.vflip.anim:not(.flipd) .vc-in{animation:flipoff .7s cubic-bezier(.35,.1,.25,1)}
@keyframes flipon{0%{transform:rotateY(0deg)}50%{transform:rotateY(95deg) scale(.96)}100%{transform:rotateY(180deg)}}
@keyframes flipoff{0%{transform:rotateY(180deg)}50%{transform:rotateY(85deg) scale(.96)}100%{transform:rotateY(0deg)}}
.vflip .face{position:absolute!important;inset:0;height:auto!important;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.vflip .face.back{transform:rotateY(180deg)}
.vflip.flipd .face:not(.back),.vflip:not(.flipd) .face.back{pointer-events:none}
/* Safari-safe flip: don't rely on backface-visibility alone — swap faces at the midpoint */
.vflip .face{transform:translateZ(1px)}
.vflip .face.back{transform:rotateY(180deg) translateZ(1px)}
.vflip:not(.flipd) .face.back{opacity:0}
.vflip.flipd .face:not(.back){opacity:0}
.vflip.anim.flipd .face:not(.back){animation:fout .7s linear}
.vflip.anim.flipd .face.back{animation:fin2 .7s linear}
.vflip.anim:not(.flipd) .face.back{animation:fout .7s linear}
.vflip.anim:not(.flipd) .face:not(.back){animation:fin2 .7s linear}
@keyframes fout{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fin2{0%,49%{opacity:0}50%,100%{opacity:1}}

function addr(n){
  const b58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz',hx='0123456789abcdef';
  let h=7;for(const ch of n.id+S.dep)h=(h*131+ch.charCodeAt(0))>>>0;
  const r=()=>{h=(Math.imul(h,1103515245)+12345)>>>0;return h>>>8};
  const pick=(s,len)=>Array.from({length:len},()=>s[r()%s.length]).join('');
  if(n.kind==='evm')return '0x'+pick(hx,40);
  if(n.kind==='tron')return 'T'+pick(b58,33);
  if(n.kind==='sol')return pick(b58,44);
  if(n.kind==='ton')return 'UQ'+pick(b58,46);
  if(n.kind==='btc')return 'bc1q'+pick('023456789acdefghjklmnpqrsuvwxyz',38);
  return pick(b58,34);
}
function qr(str){
  const N=25;let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  let r='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y)||(x>=9&&x<=15&&y>=9&&y<=15))continue;if(rnd()>.52)r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`}
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" role="img" aria-label="Deposit address QR code" fill="#0B0D10" shape-rendering="crispEdges">${f(0,0)}${f(N-7,0)}${f(0,N-7)}${r}</svg>`;
}

const FLOW=(()=>{let h=91;const rnd=()=>{h=(Math.imul(h,1103515245)+12345)>>>0;return (h>>>8)/16777216};
  const din=[],dout=[];for(let i=0;i<365;i++){din.push(rnd()<.22?Math.round(2000+rnd()*14000):0);dout.push(Math.round(200+rnd()*2600))}
  din[364]=0;dout[364]=412;return {din,dout}})();

const k0=n=>n>=100000?'₹'+(n/100000).toFixed(2)+'L':inr0(Math.round(n));
function flowTotals(k){const n=FR[k].n,i=FLOW.din.slice(-n),o=FLOW.dout.slice(-n);return {i:i.reduce((a,b)=>a+b,0),o:o.reduce((a,b)=>a+b,0),ia:i,oa:o}}
function flowChart(k){const {ia,oa}=flowTotals(k),cum=a=>{let t=0;return a.map(v=>t+=v)},ci=cum(ia),co=cum(oa),mx=Math.max(ci[ci.length-1],co[co.length-1])||1,n=ci.length;

  return `<svg class="fline" viewBox="0 0 300 80" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="flg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".16"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>

V.swap=()=>{const s=S.sw,q=quote(),e=swapErr(q),isI=s.to==='INR';
const recv=q.a?(isI?fmt(q.get):cfmt(q.get,s.to)):'0';
return `<div class="scr">${hdBack(isI?'Cash out to INR':'Swap')}
<main class="ct">
  <div class="swbox">
    <div class="swr act">
      <div class="swt"><span>From</span><span>Available ${cfmt(S.bal[s.from],s.from)} ${s.from}</span></div>
      <div class="swm"><button class="pill" data-a="pick" data-v="from">${coin(s.from)}${s.from}${I('chev',14)}</button><div class="amt ${s.amt?'':'dim'}">${s.amt||'0'}</div></div>
      <div class="swb"><span>≈ ${inr(q.gross)}</span><button class="max" data-a="max">Max</button></div>
    </div>
    <button class="flip" data-a="flip" aria-label="Switch currencies">${I('swap',18)}</button>
    <div class="swr">
      <div class="swt"><span>To${isI?' · after fees & TDS':''}</span><span>${isI?'UPI / Bank':'Balance '+cfmt(S.bal[s.to],s.to)}</span></div>
      <div class="swm"><button class="pill" data-a="pick" data-v="to">${coin(s.to)}${s.to}${I('chev',14)}</button><div class="amt ${q.a?'':'dim'}">${isI&&q.a?'₹':''}${recv}</div></div>
    </div>
  </div>
  <p class="rate">${rateTxt()} · indicative</p>
  <p class="err" role="alert">${e}</p>
  <button class="btn pri full" data-a="cont" ${!q.a||e?'disabled':''}>Continue</button>
</main>
<div class="kp">${['1','2','3','4','5','6','7','8','9','.','0','del'].map(k=>`<button class="key" data-a="key" data-v="${k}" ${k==='del'?'aria-label="Delete"':''}>${k==='del'?I('del',22):k}</button>`).join('')}</div>
</div>`};

V.review=()=>{const s=S.sw,q=quote(),isI=s.to==='INR',m=pmById(S.payTo);
return `<div class="scr">${hdBack(isI?'Review cash-out':'Review swap')}
<main class="ct">
  <div class="hero"><small>You sell</small><div class="big">${cfmt(q.a,s.from)} ${s.from}</div><small>You receive</small><div class="big pos">${isI?inr(q.get):cfmt(q.get,s.to)+' '+s.to}</div></div>
  <div class="rows">
    <div class="rw"><span>Rate</span><b>${rateTxt()}</b></div>
    ${isI?`<div class="rw"><span>Sale value</span><b>${inr(q.gross)}</b></div>
    <div class="rw"><span>Platform fee (${feeLbl()})</span><b>− ${inr(q.fee)}</b></div>
    <div class="rw"><span>TDS (1%, Sec. 194S)</span><b>− ${inr(q.tds)}</b></div>`
    :`<div class="rw"><span>Swap fee (0.1%)</span><b>${cfmt(q.fee,s.to)} ${s.to}</b></div>`}
    <div class="rw tot"><span>You receive</span><b>${isI?inr(q.get):cfmt(q.get,s.to)+' '+s.to}</b></div>
  </div>
  ${isI?`<h3 class="sh">Payout to</h3>
  <button class="opt" data-a="pickpay">${ibox(m.type==='UPI'?'zap':'bank',1)}<span class="txm"><b>${m.label}</b><small>${pmSub(m)}</small></span><span class="link">Change</span></button>
  ${S.g.vch>0?`<button class="row" style="border:0;margin-bottom:6px" role="switch" aria-checked="${S.useV}" data-a="usev"><span>Use a fee-free voucher<small>${S.g.vch} left · saves ${inr(q.gross*mem().fee/100)}</small></span><span class="sw ${S.useV?'on':''}"></span></button>`:''}
  <div class="note">${I('clock',18)}<p>Rate is held for 30 seconds. UPI and IMPS payouts usually arrive within minutes. TDS is reported against your PAN.</p></div>`:''}
</main>
<div class="foot"><button class="btn pri" data-a="confirm">${isI?I('faceid',20)+' Confirm & cash out':'Confirm swap'}</button></div></div>`};

V.processing=()=>`<div class="scr"><main class="ct center">

  <ol class="steps">${S.steps.map((t,i)=>`<li class="${i<S.pstep?'done':i===S.pstep?'cur':''}"><span class="bul">${i<S.pstep?I('check',14):''}</span>${t}</li>`).join('')}</ol>

/* ---------- Onboarding: create account, log in, lock ---------- */
const AKP=(a,left='')=>`<div class="kp akp">${['1','2','3','4','5','6','7','8','9',left,'0','del'].map(k=>k===''?'<span></span>':`<button class="key" data-a="${k==='fid'?'lockfid':a}" data-v="${k}" ${k==='del'?'aria-label="Delete"':k==='fid'?'aria-label="Use Face ID"':''}>${k==='del'?I('del',22):k==='fid'?I('faceid',24):k}</button>`).join('')}</div>`;
const DOTS=(v,n=6)=>`<div class="pdots">${Array.from({length:n},(_,i)=>`<i class="${i<v.length?'on':''}"></i>`).join('')}</div>`;
const STEPBAR=n=>`<div class="obar">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
const fmtPh=p=>p.length>5?p.slice(0,5)+' '+p.slice(5):p;

function runProcessing(){

  const iv=setInterval(()=>{S.pstep++;
    if(S.pstep>=3){clearInterval(iv);commit();S.stack=['home','success'];render('push')}else render();
  },800);

function commit(){
  const {q,s,isI,m,ref}=S.last;
  S.bal[s.from]=Math.max(0,S.bal[s.from]-q.a);

  aotp:v=>{const a=S.au;if(a.otp.length===6)return;if(v==='del')a.otp=a.otp.slice(0,-1);else a.otp+=v;render();
    if(a.otp.length===6)setTimeout(()=>{a.p1='';a.p2='';a.stage=0;a.err='';nav('au-pass')},700)},
  udet:()=>{const n=document.getElementById('u_name').value.trim(),e=document.getElementById('u_mail').value.trim(),er=document.getElementById('uerr');
    if(n.length<3){er.textContent='Enter your full name';return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){er.textContent='Enter a valid email address';return}
    S.au.name=n;S.au.email=e;S.au.p1='';S.au.p2='';S.au.stage=0;S.au.err='';nav('au-pass')},
  apass:v=>{const a=S.au,lock=S.stack[S.stack.length-1]==='lock';
    if(a.mode==='su'&&!lock){const key=a.stage?'p2':'p1';if(v==='del'){a[key]=a[key].slice(0,-1);render();return}
      if(a[key].length>=6)return;a[key]+=v;a.err='';render();
      if(a[key].length===6){if(!a.stage){setTimeout(()=>{a.stage=1;render()},250)}
        else if(a.p1===a.p2){setTimeout(()=>nav('su-faceid'),250)}
        else{setTimeout(()=>{a.err='Passcodes didn’t match. Try again.';a.p1='';a.p2='';a.stage=0;render()},250)}}
      return}
    if(v==='del'){a.p1=a.p1.slice(0,-1);render();return}
    if(a.p1.length>=6)return;a.p1+=v;a.err='';render();
    if(a.p1.length===6)setTimeout(enterApp,300)},
  lockfid:()=>faceId(enterApp),
  fidon:()=>faceId(()=>nav('kyc')),
  upan:()=>{const v=document.getElementById('u_pan').value.trim().toUpperCase(),er=document.getElementById('perr2');
    if(!/^[A-Z]{5}\d{4}[A-Z]$/.test(v)){er.textContent='PAN should look like ABCDE1234F';return}
    S.au.pan=v;S.au.digi=0;nav('kyc-aadhaar')},
  udigi:()=>{S.au.digi=1;render();setTimeout(()=>{S.au.digi=2;render()},1500)},
  uselfie:()=>{S.au.sf=1;render();setTimeout(()=>{S.au.sf=2;render()},1900)},
  enter:()=>enterApp(),
  logout:()=>{S.auth=false;closeSheet();S.stack=['welcome'];render('fade')},
  rk:v=>{S.rk=v;render()},
  buy:()=>{S.buy.amt='';nav('buy')},
  buyc:v=>{if(BUYC.includes(v))S.buy.coin=v;S.buy.amt='';nav('buy')},
  bkey:v=>{let a=S.buy.amt;if(v==='del')a=a.slice(0,-1);else{if(a===''&&(v==='0'||v==='00'))return;if((a+v).length>7)return;a+=v}S.buy.amt=a;render()},
  bq:v=>{S.buy.amt=String(v);render()},
  bcoin:()=>sheet(`<h3 style="margin-bottom:12px">Buy</h3><div class="list">${BUYC.map(k=>`<button class="crow" data-a="bsetcoin" data-v="${k}">${coin(k)}<span class="txm"><b>${k}</b><small>${COINS[k].n} · ${inr(bprice(k))}</small></span>${S.buy.coin===k?I('check',18):''}</button>`).join('')}</div>`),
  bsetcoin:v=>{S.buy.coin=v;closeSheet();render()},
  bpay:()=>sheet(`<h3 style="margin-bottom:12px">Pay with</h3><div role="radiogroup" aria-label="Payment method">${PAYM.map(m=>`<button class="opt" role="radio" aria-checked="${S.buy.pay===m.id}" data-a="bsetpay" data-v="${m.id}">${ibox(m.ic,1)}<span class="txm"><b>${m.t}</b><small>${m.l} · ${m.sub}</small></span><span class="radio ${S.buy.pay===m.id?'on':''}"></span></button>`).join('')}</div><button class="btn sec full" data-a="toastc" data-v="Add card flow opens here">${I('plus',18)} Add debit or credit card</button>`),
  bsetpay:v=>{S.buy.pay=v;closeSheet();render()},
  bcont:()=>nav('buy-review'),
  bconfirm:()=>faceId(runBuy),
  openapp:(v,el)=>openApp(el),wig:(v,el)=>{el.classList.remove('wig');void el.offsetWidth;el.classList.add('wig')},
  go:v=>nav(v),back:()=>back(),tab:v=>tab(v),toast:v=>toast(v),toastc:v=>{closeSheet();toast(v)},
  closesheet:()=>closeSheet(),sgo:v=>nav(v),
  topup:()=>topUp(),
  sellinr:()=>{S.sw={from:'USDT',to:'INR',amt:''};nav('swap')},
  depcoin:v=>{S.dep=v;nav('deposit-method')},
  net:v=>{S.net=NETS[v];nav('address')},
  copy:v=>{CLIP=v;try{navigator.clipboard.writeText(v).catch(()=>{})}catch(e){}toast('Copied')},
  share:v=>shareIt(v),
  shareapp:()=>shareIt('Spend crypto anywhere with the CRINX card — join me: https://example.com/invite/XYZ123'),
  simdep:()=>{const amt={USDT:100,USDC:100,BTC:0.001,ETH:0.02,BNB:0.1,SOL:1,TRX:500,TON:10}[S.dep];
    S.bal[S.dep]+=amt;S.m.dep+=amt*R[S.dep]/R.USDT;flowAdd('in',amt*R[S.dep]);
    S.txs.unshift({id:'DP'+rid(),type:'deposit',title:'Deposit · '+S.dep,sub:S.net.n,amt:`+${cfmt(amt,S.dep)} ${S.dep}`,time:'Just now',status:'Completed'});
    S.notes.unshift({t:'Deposit received',d:`${cfmt(amt,S.dep)} ${S.dep} on ${S.net.n}`,w:'Now',ic:'dn'});S.unread=true;
    const gx=gem(amt*R[S.dep]/R.USDT/10,'Deposit · '+S.dep);
    S.depCtx='';tab('home');toast(`${cfmt(amt,S.dep)} ${S.dep} added to your card${gx?' · +'+gx+' Gems':''}`)},
  simbig:()=>{S.bal.USDT+=5000;S.m.dep+=5000;flowAdd('in',5000*R.USDT);
    S.txs.unshift({id:'DP'+rid(),type:'deposit',title:'Deposit · USDT',sub:'TRON (TRC20)',amt:'+5,000.00 USDT',time:'Just now',status:'Completed'});
    gem(500,'Deposit · USDT');render();toast('+$5,000 deposited · +500 Gems')},
  claimm:v=>{S.m.tier=v;S.notes.unshift({t:`Welcome to ${mem().n}`,d:`Cash-out fee is now ${mem().fee}%`,w:'Now',ic:'crown'});render();memSheet(v)},
  memship:()=>{closeSheet();nav(S.phys?'phystrack':'physical')},
  order:()=>orderCard(),
  wallet:()=>walletSheet(0),
  walletgo:()=>{walletSheet(1,true);setTimeout(()=>{S.card.wallet=true;render();walletSheet(2,true)},1300)},
  theme:()=>themeSheet(),
  settheme:v=>{THEME=v;try{localStorage.setItem('exTheme',v)}catch(e){}applyTheme();render();themeSheet(true)},
  key:v=>{let a=S.sw.amt;
    if(v==='del')a=a.slice(0,-1);
    else if(v==='.'){if(!a.includes('.'))a=(a||'0')+'.'}
    else{if(a==='0')a='';const d=a.split('.')[1];if(d&&d.length>=dp(S.sw.from)+2)return;if(a.length>=12)return;a+=v}
    S.sw.amt=a;render()},
  max:()=>{const f=10**dp(S.sw.from);S.sw.amt=String(Math.floor(S.bal[S.sw.from]*f)/f);render()},
  pick:v=>pickSheet(v),
  setcoin:(k,el)=>{const side=el.dataset.side,s=S.sw;
    if(side==='from'){if(k===s.to)s.to=s.from;s.from=k}
    else{if(k===s.from)s.from=s.to!=='INR'?s.to:(k==='USDT'?'USDC':'USDT');s.to=k}
    closeSheet();render()},
  flip:()=>{const s=S.sw;if(s.to==='INR'){S.buy.coin=BUYC.includes(s.from)?s.from:'USDT';S.buy.amt='';nav('buy');return}[s.from,s.to]=[s.to,s.from];s.amt='';render()},
  cont:()=>{if(S.sw.to==='INR'&&!S.payTo)S.payTo=pmById(null).id;nav('review')},
  pickpay:()=>payPickSheet(),
  setpay:v=>{S.payTo=+v;closeSheet();render()},
  confirm:()=>{if(S.sw.to==='INR')faceId(runProcessing);else runProcessing()},
  hf:v=>{S.hf=v;render()},
  hfgo:v=>{S.hf=v;nav('history')},
  tx:v=>txSheet(v),
  coin:v=>coinSheet(v),
  cdep:v=>{S.dep=v;S.depCtx='card';nav('deposit-method')},
  cswap:v=>{S.sw={from:v,to:v==='USDT'?'USDC':'USDT',amt:''};nav('swap')},
  csell:v=>{if(S.bal[v]<=0)return;S.sw={from:v,to:'INR',amt:''};nav('swap')},
  support:()=>supportSheet(),
  cardview:()=>{if(S.card.frozen)return;S.card.show=!S.card.show;S.card.anim=true;render();S.card.anim=false},
  freeze:()=>{S.card.frozen=!S.card.frozen;if(S.card.frozen&&S.card.show){S.card.show=false;S.card.anim=true}render();S.card.anim=false;toast(S.card.frozen?'Card frozen':'Card unfrozen')},
  limit:()=>limitSheet(),
  limgem:()=>{if(S.g.gems<250){toast(`You need ${250-S.g.gems} more Gems`);return}spend(250,'Card limit +₹25,000');S.card.boost+=25000;render();limitSheet(true);toast('Max limit raised to '+inr0(maxLim()))},
  savelimit:()=>{S.card.limit=+document.getElementById('lim').value;closeSheet();toast('Daily limit set to '+inr0(S.card.limit))},
  csettings:()=>cardSettingsSheet(),
  ctog:v=>{S.card.opts[v]=!S.card.opts[v];cardSettingsSheet(true)},
  tog:v=>{S.sec[v]=!S.sec[v];
    render()},
  setdef:v=>{S.pm.forEach(m=>m.def=m.id===+v);S.payTo=+v;render();toast('Default payout method updated')},
  pmmode:v=>{S.pmMode=v;render()},
  savepm:()=>savePm(),
  redeem:v=>{const it=STORE.find(x=>x.id===v);
    if(v==='frame'&&S.g.frame==='gold'){toast('You already own this frame');return}
    if(S.g.gems<it.c){toast(`You need ${it.c-S.g.gems} more Gems`);return}
    spend(it.c,it.n);if(v==='vch')S.g.vch++;if(v==='ship')S.g.ship++;if(v==='lim')S.card.boost+=25000;if(v==='frame')S.g.frame='gold';
    render();toast(v==='lim'?'Card limit max is now '+inr0(maxLim())+'/day':'Redeemed: '+it.n)},
  usev:()=>{S.useV=!S.useV;render()},
  cardtap:()=>{if(S.card.frozen){toast('Unfreeze your card to pay');return}
    const M=[['Zomato',540],['Blinkit',386],['Starbucks',415],['Myntra',1299],['IRCTC',1765]],[n,a]=M[Math.floor(Math.random()*M.length)];
    const u=a/R.USDT;if(S.bal.USDT<u){toast('Not enough balance — deposit crypto first');return}
    S.bal.USDT-=u;flowAdd('out',a);const gm=gem(a*mem().cb/100,'Card · '+n);
    S.txs.unshift({id:'CD'+rid(),type:'card',title:n,sub:`${S.card.wallet?'Apple Pay':'Card · Tap'} · ${cfmt(u,'USDT')} USDT`,amt:'−'+inr(a),time:'Just now',status:'Completed'});
    render();toast(`Paid ${inr0(a)} at ${n}${gm?` · +${gm} Gems`:''}`)},
  about:()=>sheet(`<h3>About CRINX</h3><p class="sub" style="margin:8px 0 16px">Deposit crypto to your card, spend in INR anywhere Visa works, and cash out to any Indian bank account or UPI ID. Version 3.0 · prototype.</p><button class="btn sec full" data-a="closesheet">Close</button>`)
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset.v,el)}});
document.addEventListener('input',e=>{const k=e.target.dataset.in;
  if(k==='q'){S.q=e.target.value;document.getElementById('clist').innerHTML=coinPickList()}
  if(k==='lim'){document.getElementById('limv').textContent=inr0(+e.target.value)}});

buildLaunch();render();
</script>

</body>
</html>
